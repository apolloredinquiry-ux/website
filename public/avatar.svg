<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d15"/>
      <stop offset="0.3" stop-color="#14202c"/>
      <stop offset="0.52" stop-color="#3d3a36"/>
      <stop offset="0.66" stop-color="#a9774d"/>
      <stop offset="0.73" stop-color="#3a2c22"/>
      <stop offset="1" stop-color="#070808"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.47" cy="0.66" r="0.42">
      <stop offset="0" stop-color="#ffd6a1" stop-opacity="0.9"/>
      <stop offset="0.22" stop-color="#f0ab64" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#b06e3e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b06e3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.47" cy="0.65" r="0.2">
      <stop offset="0" stop-color="#ffe3b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd39a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.74">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2630"/>
      <stop offset="1" stop-color="#11161b"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1116"/>
      <stop offset="1" stop-color="#040506"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="cloud"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="320" height="320" fill="url(#sky)"/>
  <rect width="320" height="320" fill="url(#sun)"/>
  <circle cx="150" cy="210" r="22" fill="url(#halo)" filter="url(#soft2)"/>

  <!-- haze and clouds -->
  <g fill="#d8b48a" filter="url(#cloud)">
    <ellipse cx="88" cy="132" rx="74" ry="8" opacity="0.14"/>
    <ellipse cx="228" cy="108" rx="88" ry="7" opacity="0.1"/>
    <ellipse cx="170" cy="152" rx="110" ry="9" opacity="0.16"/>
    <ellipse cx="66" cy="172" rx="76" ry="7" opacity="0.12"/>
  </g>
  <ellipse cx="168" cy="198" rx="170" ry="42" fill="#d08a4c" opacity="0.16" filter="url(#soft)"/>

  <!-- distant skyline -->
  <g fill="url(#far)" opacity="0.85">
    <rect x="0" y="178" width="22" height="80"/>
    <rect x="26" y="164" width="15" height="94"/>
    <rect x="44" y="188" width="26" height="70"/>
    <rect x="73" y="156" width="13" height="102"/>
    <rect x="90" y="176" width="24" height="82"/>
    <rect x="118" y="162" width="17" height="96"/>
    <rect x="139" y="184" width="30" height="74"/>
    <rect x="173" y="152" width="14" height="106"/>
    <rect x="190" y="172" width="32" height="86"/>
    <rect x="226" y="160" width="18" height="98"/>
    <rect x="248" y="182" width="30" height="76"/>
    <rect x="282" y="166" width="20" height="92"/>
    <rect x="305" y="190" width="15" height="68"/>
  </g>

  <!-- distant lights -->
  <g fill="#e9b779" opacity="0.45">
    <rect x="29" y="176" width="2" height="3"/>
    <rect x="37" y="192" width="2" height="3"/>
    <rect x="78" y="170" width="2" height="3"/>
    <rect x="82" y="188" width="2" height="3"/>
    <rect x="123" y="176" width="2" height="3"/>
    <rect x="128" y="194" width="2" height="3"/>
    <rect x="177" y="168" width="2" height="3"/>
    <rect x="180" y="188" width="2" height="3"/>
    <rect x="231" y="176" width="2" height="3"/>
    <rect x="235" y="196" width="2" height="3"/>
    <rect x="288" y="182" width="2" height="3"/>
  </g>

  <!-- near towers -->
  <g fill="url(#near)">
    <rect x="52" y="212" width="42" height="108"/>
    <path d="M104 320v-118l10-7 10 7v118z"/>
    <rect x="128" y="238" width="34" height="82"/>
    <path d="M167 320V196l15-11 15 11v124z"/>
    <rect x="203" y="224" width="46" height="96"/>
    <path d="M257 320v-96l9-6 9 6v96z"/>
    <rect x="282" y="246" width="38" height="74"/>
  </g>
  <g fill="#f4bd7a" opacity="0.8">
    <rect x="110" y="218" width="3" height="4"/>
    <rect x="115" y="236" width="3" height="4"/>
    <rect x="110" y="256" width="3" height="4"/>
    <rect x="174" y="208" width="3" height="4"/>
    <rect x="182" y="226" width="3" height="4"/>
    <rect x="174" y="248" width="3" height="4"/>
    <rect x="182" y="270" width="3" height="4"/>
    <rect x="213" y="240" width="2" height="3"/>
    <rect x="222" y="258" width="2" height="3"/>
    <rect x="262" y="240" width="2" height="3"/>
    <rect x="268" y="260" width="2" height="3"/>
    <rect x="68" y="230" width="2" height="3"/>
    <rect x="80" y="250" width="2" height="3"/>
    <rect x="294" y="264" width="2" height="3"/>
  </g>
  <g fill="#bcd0df" opacity="0.35">
    <rect x="59" y="226" width="2" height="2"/>
    <rect x="83" y="266" width="2" height="2"/>
    <rect x="136" y="250" width="2" height="2"/>
    <rect x="143" y="272" width="2" height="2"/>
    <rect x="236" y="238" width="2" height="2"/>
    <rect x="288" y="260" width="2" height="2"/>
  </g>

  <!-- antennas -->
  <g stroke="#050708" stroke-width="2">
    <line x1="179" y1="196" x2="179" y2="176"/>
    <line x1="266" y1="224" x2="266" y2="206"/>
  </g>
  <circle cx="179" cy="174" r="2" fill="#ff5a3d"/>
  <circle cx="179" cy="174" r="7" fill="#ff5a3d" opacity="0.2" filter="url(#soft2)"/>
  <circle cx="266" cy="204" r="1.4" fill="#ffb26b"/>

  <!-- foreground haze line -->
  <rect x="0" y="263" width="320" height="1" fill="#e9b77c" opacity="0.24"/>

  <!-- palms -->
  <g fill="#030405">
    <!-- left palm -->
    <path d="M46 320c10-54 8-102-4-146l10-4c15 47 18 97 8 150z"/>
    <path d="M48 172C28 150 8 142-10 146c18-14 46-6 64 16z"/>
    <path d="M48 172C38 142 26 120 6 106c26 10 44 32 50 62z"/>
    <path d="M48 172c4-34-2-64-16-88 22 18 30 48 24 84z"/>
    <path d="M48 172c20-28 42-40 66-44-22 14-40 30-58 50z"/>
    <path d="M48 172c24-2 48 4 68 20-24-10-46-12-64-10z"/>
    <path d="M48 172c-18-2-38 4-52 20 18-14 38-16 54-12z"/>
    <path d="M48 172c-2 18-12 34-28 46 10-18 18-34 20-46z"/>
    <path d="M60 166c12 2 24 8 32 18-12-6-24-10-34-10z"/>
    <circle cx="47" cy="177" r="4"/>
    <circle cx="58" cy="180" r="3.4"/>
    <circle cx="54" cy="170" r="3"/>

    <!-- right palm -->
    <path d="M286 320c-8-44-4-86 10-122l-9-4c-16 39-21 84-14 126z"/>
    <path d="M289 198c16-22 36-30 54-27-18-13-44-4-60 17z"/>
    <path d="M289 198c8-28 20-48 40-61-24 8-42 28-50 57z"/>
    <path d="M289 198c-8-28-4-54 8-74-19 15-28 42-24 69z"/>
    <path d="M289 198c-22-24-44-34-68-36 22 11 42 24 60 42z"/>
    <path d="M289 198c-24 0-46 8-64 24 24-11 45-14 64-12z"/>
    <path d="M289 198c18 0 36 8 48 22-18-12-36-16-52-12z"/>
    <path d="M276 194c-9 1-19 6-27 14 11-5 21-7 29-6z"/>
    <circle cx="291" cy="199" r="3.6"/>
    <circle cx="280" cy="197" r="3"/>
  </g>

  <rect width="320" height="320" fill="url(#vignette)"/>
</svg>
